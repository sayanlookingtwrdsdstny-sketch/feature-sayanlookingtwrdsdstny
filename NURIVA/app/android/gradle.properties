org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Workaround for a Windows-only Kotlin Build Tools API bug: the
# out-of-process incremental-compile worker fails to close its own cache
# files ("Could not close incremental caches ... class-fq-name-to-source.tab")
# on firebase_core's compileDebugKotlin, reproduced twice even after a clean
# rebuild (Module 02, 2026-09-17). In-process compilation avoids the
# cross-process file handle that triggers it.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
